<ng-container *ngIf="detailedComponent; else genericOrEmpty">
  <ng-container *ngComponentOutlet="detailedComponent"></ng-container>
</ng-container>

<ng-template #genericOrEmpty>
  <gng-form-shell *ngIf="config; else notReady" [config]="config"></gng-form-shell>
</ng-template>

<ng-template #notReady>
  <div class="gng-form-page__empty">
    <i class="pi pi-hourglass"></i>
    <h2>فرم «{{ requestedCode }}» هنوز در این حوزه ساخته نشده</h2>
    <p>این آیتم منو به یک فرم واقعی در alm.Form وصل است، اما پروتوتایپ آن هنوز در نوبت ساخت قرار نگرفته.</p>
  </div>
</ng-template>
